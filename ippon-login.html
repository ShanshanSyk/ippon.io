<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPON ログイン</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{
    --bg:#0B0D12; --panel:#15181F; --panel-line:#262B36;
    --gold:#FFE900; --gold-dim:#8C8300; --text:#F5F1E8; --text-dim:#8A8F9C; --red:#C74B3E;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:380px;
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:12px; padding:32px 28px;
  }
  h1{
    font-family:'Oswald', sans-serif; font-size:22px; letter-spacing:0.06em;
    margin:0 0 4px; color:var(--gold);
  }
  .sub{ font-size:12px; color:var(--text-dim); margin-bottom:24px; }
  label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; }
  input{
    width:100%; background:#0F1117; border:1px solid var(--panel-line);
    color:var(--text); padding:12px 14px; border-radius:6px; font-size:14px;
    margin-bottom:16px; font-family:inherit;
  }
  input:focus{ outline:none; border-color:var(--gold-dim); }
  button{
    width:100%; background:var(--gold); color:#1A1204;
    font-family:'Oswald', sans-serif; font-weight:700; letter-spacing:0.05em;
    border:none; border-radius:6px; padding:14px 0; font-size:15px; cursor:pointer;
  }
  button:hover{ background:#fff066; }
  button:disabled{ opacity:0.5; cursor:default; }
  .error{ color:var(--red); font-size:12px; margin-top:12px; min-height:16px; }
  .switch{ font-size:12px; color:var(--text-dim); margin-top:18px; text-align:center; }
  .switch a{ color:var(--gold); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>ログイン</h1>
    <div class="sub">オーナー用アカウントでログインします</div>

    <form id="loginForm">
      <label for="id">ログインID</label>
      <input id="id" type="text" placeholder="半角英数字" required>

      <label for="password">パスワード</label>
      <input id="password" type="password" required>

      <button type="submit" id="submitBtn">ログイン</button>
      <div class="error" id="errorText"></div>
    </form>

    <div class="switch">アカウントをお持ちでない方は <a href="ippon-signup.html">アカウント作成</a></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorText.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'ログイン中…';

      const id = document.getElementById('id').value.trim();
      const password = document.getElementById('password').value;
      const email = idToEmail(id);

      try{
        await auth.signInWithEmailAndPassword(email, password);
        location.href = 'ippon-home.html';
      }catch(err){
        console.error(err);
        errorText.textContent = 'IDまたはパスワードが違います';
        submitBtn.disabled = false;
        submitBtn.textContent = 'ログイン';
      }
    });
  </script>
</body>
</html>
