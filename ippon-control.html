<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理画面 - IPPON</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --gold:      #FFE900;
    --gold-dim:  #C7B500;
    --ink:       #14140F;
    --ink-dim:   #5A5A44;
    --bar:       #0A0A0C;
    --white:     #FFFFFF;
    --line:      #E3D900;
    --red:       #C7302B;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--gold);
    color:var(--ink);
    font-family:'Noto Sans JP', system-ui, sans-serif;
  }
  a{ color:inherit; }

  /* ---- 上部バー ---- */
  .topbar{
    background:var(--bar);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
  }
  .topbar .logo{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.15em;
    color:var(--gold);
  }
  .topbar .room-info{
    font-size:13px;
    color:#EDEDED;
  }
  .topbar .room-info b{ color:var(--gold); font-weight:600; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .operator-wrap{ position:relative; }
  .operator-btn{
    background:transparent; border:1px solid rgba(255,255,255,0.25); color:var(--gold);
    font-size:12px; padding:5px 10px; border-radius:14px; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .operator-btn:hover{ border-color:var(--gold); }
  .operator-dropdown{
    display:none;
    position:absolute; right:0; top:calc(100% + 6px);
    background:#1C1C16; border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; overflow:hidden; z-index:60;
    min-width:140px;
  }
  .operator-dropdown.show{ display:block; }
  .operator-dropdown button{
    display:block; width:100%; text-align:left;
    background:transparent; border:none; color:#EDEDED;
    font-size:13px; padding:11px 14px; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .operator-dropdown button:hover{ background:rgba(255,255,255,0.08); }
  .operator-dropdown button:first-child{ border-bottom:1px solid rgba(255,255,255,0.1); }
  .menu-btn{
    background:transparent; border:none; color:#fff; font-size:20px;
    cursor:pointer; padding:2px 6px;
  }

  /* ---- サイドメニュー ---- */
  .sidebar{
    width:180px;
    flex-shrink:0;
    background:var(--bar);
    padding:12px 0;
    transition:margin-left .18s ease;
  }
  .sidebar.collapsed{ margin-left:-180px; }
  .menu-item-full{
    display:block;
    padding:14px 22px;
    font-size:14px;
    font-weight:600;
    color:#fff;
    text-decoration:none;
    border-left:3px solid transparent;
  }
  .menu-item-full.disabled{ color:#5A5A5A; pointer-events:none; }
  .menu-item-full.active{ color:var(--gold); border-left-color:var(--gold); background:rgba(255,233,0,0.06); }
  .menu-group-label-full{
    font-size:10px;
    color:#7A7A7A;
    letter-spacing:0.1em;
    padding:16px 22px 4px;
  }

  /* ---- 全体レイアウト ---- */
  .layout{ display:flex; height:calc(100vh - 49px); }

  /* ---- メインエリア ---- */
  .main{ flex:1; padding:26px 28px; min-width:0; overflow-y:auto; }

  .status-box{
    max-width:320px;
    margin-bottom:24px;
  }
  .status-current{
    font-size:13px; font-weight:600; margin-bottom:10px;
  }
  .status-current span{ color:var(--ink); text-decoration:underline; text-decoration-color:rgba(20,20,15,0.3); }
  .status-grid{ display:flex; flex-direction:column; gap:8px; }
  .status-row{ display:flex; gap:8px; }
  .status-btn{
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:12px 14px;
    border:2px solid var(--ink);
    border-radius:8px;
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
    flex:1;
  }
  .status-btn.full{ width:100%; }
  .status-btn:hover{ background:#FAFAF0; }
  .status-btn.active{ background:var(--ink); color:var(--gold); }

  .panels{ display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }

  .score-panel{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(20,20,15,0.15);
    border-radius:10px;
    padding:20px;
    min-width:260px;
  }
  .panel-title{
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    margin:0 0 14px;
  }

  .stage-toggle{ display:flex; border:1px solid var(--ink); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .stage-btn{ flex:1; background:transparent; color:var(--ink); font-size:12px; padding:8px 0; border:none; font-weight:600; cursor:pointer; }
  .stage-btn.active{ background:var(--ink); color:var(--gold); }

  .score-readout{
    font-family:'Oswald', sans-serif; font-size:44px; font-weight:700; line-height:1;
    margin:14px 0 16px;
  }
  .score-readout .max{ font-size:20px; color:var(--ink-dim); }

  .btn-plus{
    width:100%; background:var(--ink); color:var(--gold);
    font-family:'Oswald', sans-serif; font-weight:700; font-size:18px;
    padding:14px 0; border:none; border-radius:6px; cursor:pointer; margin-bottom:8px;
  }
  .btn-row{ display:flex; gap:8px; }
  .btn-secondary{
    flex:1; background:transparent; border:1px solid var(--ink); color:var(--ink);
    font-size:12px; padding:9px 0; border-radius:6px; cursor:pointer; font-weight:600;
  }

  .participants-panel{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(20,20,15,0.15);
    border-radius:10px;
    padding:20px;
    width:220px;
    max-width:220px;
    flex-shrink:0;
  }
  .panel-title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .panel-title-row .panel-title{ margin:0; }
  .reset-answerers-btn{
    background:transparent; border:1px solid var(--ink); color:var(--ink);
    font-size:11px; padding:5px 10px; border-radius:6px; cursor:pointer; font-weight:600;
    font-family:'Noto Sans JP', sans-serif;
  }
  .reset-answerers-btn:hover{ background:var(--ink); color:var(--gold); }
  .participant-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid rgba(20,20,15,0.1);
    font-size:14px;
    gap:10px;
  }
  .participant-row:last-child{ border-bottom:none; }
  .participant-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .participant-score-wrap{ display:flex; align-items:center; gap:8px; }
  .participant-score{ font-family:'Oswald', sans-serif; font-weight:700; min-width:44px; text-align:right; }
  .pm-btn{
    width:24px; height:24px; border-radius:5px;
    border:1px solid var(--ink); background:transparent; color:var(--ink);
    font-size:13px; font-weight:700; cursor:pointer; line-height:1;
    font-family:'Noto Sans JP', sans-serif;
  }
  .pm-btn:hover{ background:var(--ink); color:var(--gold); }
  .participant-empty{ font-size:12px; color:var(--ink-dim); padding:8px 0; }

  /* ---- 右LOGパネル ---- */
  .log-panel{
    width:210px;
    flex-shrink:0;
    border-left:1px solid rgba(20,20,15,0.2);
    padding:20px 16px 20px 18px;
    display:flex;
    flex-direction:column;
    min-height:0;
    transition:width .15s ease, padding .15s ease;
  }
  .log-panel.collapsed{
    width:36px;
    padding:20px 8px;
  }
  .log-panel.collapsed .log-list-scroll,
  .log-panel.collapsed .log-title-text{ display:none; }
  .log-title{
    font-family:'Oswald', sans-serif; font-weight:700; font-size:14px;
    letter-spacing:0.08em; margin:0 0 14px; flex-shrink:0;
    display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .log-toggle-icon{ font-size:11px; transition:transform .15s ease; }
  .log-panel.collapsed .log-toggle-icon{ transform:rotate(-90deg); }
  .log-list-scroll{
    overflow-y:auto;
    flex:1;
    min-height:0;
  }
  .log-entry{
    font-size:11px; line-height:1.5;
    border-bottom:1px solid rgba(20,20,15,0.12);
    padding:8px 0;
  }
  .log-entry b{ font-weight:700; }
  .log-time{ display:block; color:var(--ink-dim); font-size:10px; margin-top:2px; }
  .log-empty{ font-size:12px; color:var(--ink-dim); }

  @media (max-width: 900px){
    .sidebar{
      position:fixed; left:0; top:49px; bottom:0; z-index:80;
      box-shadow:4px 0 16px rgba(0,0,0,0.3);
    }
    .sidebar.collapsed{ margin-left:-180px; }
    .log-panel{ width:100%; border-left:none; border-top:1px solid rgba(20,20,15,0.2); }
  }
</style>
</head>
<body>

  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="メニュー">☰</button>
    <div class="logo">IPPON</div>
    <div class="topbar-right">
      <div class="room-info" id="roomInfo">部屋を確認中…</div>
      <div class="operator-wrap">
        <button class="operator-btn" id="operatorBtn"></button>
        <div class="operator-dropdown" id="operatorDropdown">
          <button id="renameBtn">名前を変更</button>
          <button id="logoutBtn">ログアウト</button>
        </div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <a class="menu-item-full disabled">回答</a>
      <a class="menu-item-full disabled">採点</a>
      <div class="menu-group-label-full">管理者のみ表示</div>
      <a class="menu-item-full active">管理画面</a>
      <a class="menu-item-full" id="participantsLink">参加者一覧</a>
      <a class="menu-item-full" id="roomSettingsLink">部屋の設定</a>
    </div>

    <div class="main">
      <div class="status-box">
        <div class="status-current">現在のステータス：<span id="currentStatusLabel">-</span></div>
        <div class="status-grid" id="statusSelect">
          <button class="status-btn full" data-status="準備中">準備中</button>
          <div class="status-row">
            <button class="status-btn" data-status="回答受付中">回答受付開始</button>
            <button class="status-btn" data-status="回答締切">回答締め切り</button>
          </div>
          <button class="status-btn full" data-status="採点締切">採点締め切り</button>
        </div>
      </div>

      <div class="panels">
        <div class="score-panel">
          <div class="panel-title">現在の得点（IPPON表示）</div>
          <div class="stage-toggle">
            <button class="stage-btn active" id="stageBlock">ブロック選</button>
            <button class="stage-btn" id="stageFinal">決勝戦</button>
          </div>
          <div class="score-readout"><span id="scoreNumber">0</span><span class="max" id="maxLabel">/10</span></div>
        </div>

        <div class="participants-panel">
          <div class="panel-title-row">
            <div class="panel-title">回答者一覧</div>
            <button class="reset-answerers-btn" id="resetAnswerersBtn">リセット</button>
          </div>
          <div id="participantList"><div class="participant-empty">読み込み中…</div></div>
        </div>
      </div>
    </div>

    <div class="log-panel" id="logPanel">
      <div class="log-title" id="logToggle"><span class="log-toggle-icon">▼</span><span class="log-title-text">LOG</span></div>
      <div class="log-list-scroll" id="logList"><div class="log-empty">まだ記録はありません</div></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const roomId = params.get('room');

    // アカウントは作らないけど、LOGに「誰が」を残すために名前を使う。
    // 一度も設定されていなければ、部屋を作ったときの名前を後で自動的に使う（ポップアップでは聞かない）
    let operatorName = localStorage.getItem('ippon-operator-name') || null;

    const roomInfo = document.getElementById('roomInfo');
    const scoreNumber = document.getElementById('scoreNumber');
    const maxLabel = document.getElementById('maxLabel');
    const stageBlockBtn = document.getElementById('stageBlock');
    const stageFinalBtn = document.getElementById('stageFinal');
    const statusSelect = document.getElementById('statusSelect');
    const currentStatusLabel = document.getElementById('currentStatusLabel');
    const participantList = document.getElementById('participantList');
    const logList = document.getElementById('logList');
    document.getElementById('logToggle').addEventListener('click', () => {
      document.getElementById('logPanel').classList.toggle('collapsed');
    });

    if(!roomId){
      roomInfo.textContent = 'URLに ?room=部屋番号 がありません';
    } else {
      const menuBtn = document.getElementById('menuBtn');
      const sidebar = document.getElementById('sidebar');
      menuBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

      document.getElementById('participantsLink').href = 'ippon-participants.html?room=' + roomId;
      document.getElementById('roomSettingsLink').href = 'ippon-room-settings.html?room=' + roomId;

      // ---- 名前の変更・ログアウト ----
      const operatorBtn = document.getElementById('operatorBtn');
      const operatorDropdown = document.getElementById('operatorDropdown');
      if(operatorName){ operatorBtn.textContent = operatorName; }

      operatorBtn.addEventListener('click', () => operatorDropdown.classList.toggle('show'));
      document.addEventListener('click', (e) => {
        if(!e.target.closest('.operator-wrap')){ operatorDropdown.classList.remove('show'); }
      });

      document.getElementById('renameBtn').addEventListener('click', () => {
        const newName = prompt('新しい名前を入力してください', operatorName);
        if(newName && newName.trim()){
          operatorName = newName.trim();
          localStorage.setItem('ippon-operator-name', operatorName);
          operatorBtn.textContent = operatorName;
        }
        operatorDropdown.classList.remove('show');
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('ippon-operator-name');
        location.href = 'index.html';
      });
      const roomRef = db.collection('rooms').doc(roomId);

      function addLog(text, resultingScore){
        db.collection('rooms').doc(roomId).collection('logs').add({
          text,
          operatorName,
          score: resultingScore,
          at: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      roomRef.onSnapshot((snap) => {
        if(!snap.exists){ roomInfo.textContent = 'この部屋番号は見つかりません'; return; }
        const data = snap.data();
        roomInfo.innerHTML = '部屋：<b>' + escapeHtml(data.name) + '</b>';

        if(!operatorName){
          operatorName = data.hostName || '名無し';
          localStorage.setItem('ippon-operator-name', operatorName);
          operatorBtn.textContent = operatorName;
        }

        scoreNumber.textContent = data.score;
        maxLabel.textContent = '/' + data.maxScore;
        stageBlockBtn.classList.toggle('active', data.maxScore === 10);
        stageFinalBtn.classList.toggle('active', data.maxScore === 16);

        const status = data.status || '準備中';
        currentStatusLabel.textContent = status;
        statusSelect.querySelectorAll('.status-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.status === status);
        });
      });

      function setStage(max){
        db.runTransaction(async (tx) => {
          const snap = await tx.get(roomRef);
          const data = snap.data();
          const newScore = Math.min(data.score, max);
          tx.update(roomRef, { maxScore: max, score: newScore });
          addLog(operatorName + 'さんが満点を' + max + '点に変更しました', newScore);
        });
      }
      stageBlockBtn.addEventListener('click', () => setStage(10));
      stageFinalBtn.addEventListener('click', () => setStage(16));

      // ステータスのボタン（IPPON表示の得点=pt は、どれを押しても0に戻る。参加者のpon得点はここでは触らない）
      statusSelect.addEventListener('click', (e) => {
        const btn = e.target.closest('.status-btn');
        if(!btn) return;
        const status = btn.dataset.status;
        const update = { status, score: 0 };
        if(status === '回答受付中'){
          update.currentAnswerer = null; // 新しいラウンドなので、回答権をリセット
        }
        roomRef.update(update);
        addLog(operatorName + 'さんがステータスを「' + status + '」に変更しました', 0);
      });

      // ---- 回答者一覧 ----
      const participantsRef = db.collection('rooms').doc(roomId).collection('participants');

      window.adjustParticipantScore = (id, delta) => {
        db.runTransaction(async (tx) => {
          const ref = participantsRef.doc(id);
          const snap = await tx.get(ref);
          const p = snap.data();
          const newScore = Math.max(0, (p.score || 0) + delta);
          tx.update(ref, { score: newScore });
        });
      };

      document.getElementById('resetAnswerersBtn').addEventListener('click', async () => {
        if(!confirm('回答者全員のponを0にリセットしますか？')) return;
        const snap = await participantsRef.where('role', '==', '回答者').get();
        const batch = db.batch();
        snap.forEach((doc) => batch.update(doc.ref, { score: 0 }));
        await batch.commit();
        addLog(operatorName + 'さんが回答者一覧のponを全員リセットしました', null);
      });

      participantsRef
        .orderBy('joinedAt', 'asc')
        .onSnapshot((snap) => {
          const answerers = snap.docs.filter((doc) => (doc.data().role || '回答者') === '回答者');
          if(answerers.length === 0){
            participantList.innerHTML = '<div class="participant-empty">まだ回答者がいません</div>';
            return;
          }
          participantList.innerHTML = answerers.map((doc) => {
            const p = doc.data();
            const id = doc.id;
            return `
              <div class="participant-row">
                <span class="participant-name">${escapeHtml(p.name)}</span>
                <div class="participant-score-wrap">
                  <button class="pm-btn" onclick="adjustParticipantScore('${id}', -1)">－</button>
                  <span class="participant-score">${p.score ?? 0} pon</span>
                  <button class="pm-btn" onclick="adjustParticipantScore('${id}', 1)">＋</button>
                </div>
              </div>
            `;
          }).join('');
        });

      // ---- LOG ----
      db.collection('rooms').doc(roomId).collection('logs')
        .orderBy('at', 'desc')
        .limit(100)
        .onSnapshot((snap) => {
          if(snap.empty){
            logList.innerHTML = '<div class="log-empty">まだ記録はありません</div>';
            return;
          }
          logList.innerHTML = snap.docs.map((doc) => {
            const log = doc.data();
            const time = log.at ? log.at.toDate().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '…';
            return `<div class="log-entry">${escapeHtml(log.text)}<span class="log-time">${time}</span></div>`;
          }).join('');
        });
    }

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
  </script>

</body>
</html>
