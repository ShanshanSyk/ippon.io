<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPON OBS表示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

  *{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    background:transparent; /* OBSのブラウザソースではここが透過されます */
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #frame{
    width:100vw;
    max-width:100vh*16/9;
    aspect-ratio:16/9;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.5)) drop-shadow(0 0 0 rgba(255,233,0,0));
    transition: filter .08s steps(1,end);
  }
  #frame.pop{
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.5)) drop-shadow(0 0 22px rgba(255,233,0,0.75));
  }
  .ring{ stroke:rgba(0,0,0,0.35); stroke-width:1; }
  .ring.new{ animation: ringSnap .1s steps(2,end); }
  @keyframes ringSnap{
    0%   { opacity:0; transform:scale(1.05); transform-origin:320px 180px; }
    60%  { opacity:1; transform:scale(1);    transform-origin:320px 180px; }
    100% { opacity:1; transform:scale(1);    transform-origin:320px 180px; }
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
  }

  .ippon-banner{
    position:absolute;
    left:0; right:0;
    top:50%;
    height:26%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0A0A0C;
    border-top:3px solid #FFE900;
    border-bottom:3px solid #FFE900;
    box-shadow:0 12px 34px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(-50%) translateX(130%);
    z-index:5;
  }
  .ippon-banner span{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(60px, 15vw, 168px);
    letter-spacing:0.16em;
    color:#FFFFFF;
  }
  .ippon-banner.show{
    animation: bannerSlide .45s cubic-bezier(.16,.84,.24,1) forwards;
  }
  @keyframes bannerSlide{
    0%   { transform:translateY(-50%) translateX(130%); opacity:0; }
    65%  { transform:translateY(-50%) translateX(-2%);  opacity:1; }
    100% { transform:translateY(-50%) translateX(0%);   opacity:1; }
  }
</style>
</head>
<body>

  <div class="stage">
    <svg id="frame" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="ippon-banner" id="ipponBanner"><span>IPPON</span></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const roomId = params.get('room');

  let score = 0;
  let maxScore = 10;

  const OUTER = 10;
  const W = 640, H = 360;
  const CX = W/2, CY = H/2;

  const svg = document.getElementById('frame');
  const frameWrap = document.getElementById('frame');
  const ipponBanner = document.getElementById('ipponBanner');

  function render(prevScore){
    const thickness = (CY - OUTER) / maxScore;
    let svgMarkup = '';

    for(let i = 0; i < score; i++){
      const insetX = OUTER + i * thickness;
      const insetY = OUTER + i * thickness;
      const sizeX = W - insetX * 2;
      const sizeY = H - insetY * 2;
      if(sizeX <= 0 || sizeY <= 0) break;

      const depthRatio = i / Math.max(1, maxScore - 1);
      const lightness = 40 + depthRatio * 28;
      const fill = `hsl(58, 100%, ${lightness}%)`;
      const isNew = i >= prevScore;

      const innerX = insetX + thickness;
      const innerY = insetY + thickness;
      const innerSizeX = Math.max(0, sizeX - thickness * 2);
      const innerSizeY = Math.max(0, sizeY - thickness * 2);

      const d = `M${insetX} ${insetY} H${insetX + sizeX} V${insetY + sizeY} H${insetX} Z
                  M${innerX} ${innerY} H${innerX + innerSizeX} V${innerY + innerSizeY} H${innerX} Z`;

      svgMarkup += `<path class="ring${isNew ? ' new' : ''}" d="${d}" fill-rule="evenodd" fill="${fill}" />`;
      svgMarkup += `<line x1="${insetX}" y1="${insetY}" x2="${insetX+sizeX}" y2="${insetY}" stroke="#fff" stroke-width="2" opacity="0.35"/>`;
      svgMarkup += `<line x1="${insetX}" y1="${insetY}" x2="${insetX}" y2="${insetY+sizeY}" stroke="#fff" stroke-width="2" opacity="0.35"/>`;
      svgMarkup += `<line x1="${innerX}" y1="${innerY+innerSizeY}" x2="${innerX+innerSizeX}" y2="${innerY+innerSizeY}" stroke="#000" stroke-width="2" opacity="0.25"/>`;
      svgMarkup += `<line x1="${innerX+innerSizeX}" y1="${innerY}" x2="${innerX+innerSizeX}" y2="${innerY+innerSizeY}" stroke="#000" stroke-width="2" opacity="0.25"/>`;
    }
    svg.innerHTML = svgMarkup;
  }

  function pop(){
    frameWrap.classList.add('pop');
    setTimeout(() => frameWrap.classList.remove('pop'), 110);
  }

  function showIpponBanner(){
    ipponBanner.classList.remove('show');
    void ipponBanner.offsetWidth;
    ipponBanner.classList.add('show');
    playShimmerSound();
  }
  function hideIpponBanner(){
    ipponBanner.classList.remove('show');
  }

  // ---- 効果音 ----
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  const SCALE = [
    261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
    523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77,
    1046.50, 1174.66
  ];

  function playNote(freq){
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.5, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.18);

    const osc2 = ctx.createOscillator();
    osc2.type = 'square';
    osc2.frequency.value = freq * 2;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, now);
    g2.gain.exponentialRampToValueAtTime(0.12, now + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    osc2.connect(g2).connect(ctx.destination);
    osc2.start(now); osc2.stop(now + 0.12);
  }

  function playScoreSound(currentScore){
    const idx = Math.min(currentScore - 1, SCALE.length - 1);
    if(idx >= 0){ playNote(SCALE[idx]); }
  }

  function playShimmerSound(){
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    const size = Math.floor(ctx.sampleRate * 2.0);
    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < size; i++){ data[i] = Math.random() * 2 - 1; }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 5000;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.linearRampToValueAtTime(0.09, now + 0.03);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
    noise.connect(hp).connect(noiseGain).connect(ctx.destination);
    noise.start(now);

    const shimmerFreqs = [3200, 4300, 5600, 7100];
    shimmerFreqs.forEach((freq, idx) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      const og = ctx.createGain();
      const amp = 0.04 / (idx + 1);
      og.gain.setValueAtTime(0.0001, now);
      og.gain.linearRampToValueAtTime(amp, now + 0.015);
      og.gain.exponentialRampToValueAtTime(0.0001, now + 1.8 - idx * 0.15);
      o.connect(og).connect(ctx.destination);
      o.start(now); o.stop(now + 1.9);
    });
  }

  // ---- Firestoreから届く状態を反映する ----
  if(roomId){
    const roomRef = db.collection('rooms').doc(roomId);
    roomRef.onSnapshot((snap) => {
      if(!snap.exists) return;
      const data = snap.data();
      const newScore = data.score;
      const newMax = data.maxScore;
      const stageChanged = newMax !== maxScore;
      const prev = score;

      maxScore = newMax;
      score = newScore;

      if(stageChanged){
        render(score);   // ステージ変更時は新規演出なしで再描画
        hideIpponBanner();
        return;
      }

      render(prev);
      if(score > prev){
        pop();
        playScoreSound(score);
        if(score === maxScore){ showIpponBanner(); }
      } else if(score < prev && score < maxScore){
        hideIpponBanner();
      }
    });
  }

  render(0);
</script>

</body>
</html>
