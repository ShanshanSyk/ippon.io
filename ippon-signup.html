<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPON アカウント作成</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{
    --bg:#0B0D12; --panel:#15181F; --panel-line:#262B36;
    --gold:#FFE900; --gold-dim:#8C8300; --text:#F5F1E8; --text-dim:#8A8F9C; --red:#C74B3E;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width:380px;
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:12px; padding:32px 28px;
  }
  h1{
    font-family:'Oswald', sans-serif; font-size:22px; letter-spacing:0.06em;
    margin:0 0 4px; color:var(--gold);
  }
  .sub{ font-size:12px; color:var(--text-dim); margin-bottom:24px; }
  label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; }
  input{
    width:100%; background:#0F1117; border:1px solid var(--panel-line);
    color:var(--text); padding:12px 14px; border-radius:6px; font-size:14px;
    margin-bottom:16px; font-family:inherit;
  }
  input:focus{ outline:none; border-color:var(--gold-dim); }
  .hint{ font-size:11px; color:var(--text-dim); margin-top:-12px; margin-bottom:16px; }
  button{
    width:100%; background:var(--gold); color:#1A1204;
    font-family:'Oswald', sans-serif; font-weight:700; letter-spacing:0.05em;
    border:none; border-radius:6px; padding:14px 0; font-size:15px; cursor:pointer;
  }
  button:hover{ background:#fff066; }
  button:disabled{ opacity:0.5; cursor:default; }
  .error{ color:var(--red); font-size:12px; margin-top:12px; min-height:16px; }
  .switch{ font-size:12px; color:var(--text-dim); margin-top:18px; text-align:center; }
  .switch a{ color:var(--gold); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>アカウント作成</h1>
    <div class="sub">オーナー用のアカウントを作ります</div>

    <form id="signupForm">
      <label for="name">表示名</label>
      <input id="name" type="text" placeholder="例：山田太郎" required>

      <label for="id">ログインID</label>
      <input id="id" type="text" placeholder="半角英数字（例：yamada01）" required>
      <div class="hint">日本語・記号・スペースは使えません</div>

      <label for="password">パスワード</label>
      <input id="password" type="password" placeholder="6文字以上" required minlength="6">

      <button type="submit" id="submitBtn">アカウントを作成</button>
      <div class="error" id="errorText"></div>
    </form>

    <div class="switch">すでにアカウントがある方は <a href="ippon-login.html">ログイン</a></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');

    function showError(message){
      errorText.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      submitBtn.disabled = true;
      submitBtn.textContent = '作成中…';

      const name = document.getElementById('name').value.trim();
      const id = document.getElementById('id').value.trim();
      const password = document.getElementById('password').value;
      const email = idToEmail(id);

      try{
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('owners').doc(cred.user.uid).set({
          name,
          id,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        location.href = 'ippon-home.html';
      }catch(err){
        console.error(err);
        if(err.code === 'auth/email-already-in-use'){
          showError('そのIDはすでに使われています');
        } else if(err.code === 'auth/weak-password'){
          showError('パスワードは6文字以上にしてください');
        } else {
          showError('作成できませんでした：' + err.message);
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'アカウントを作成';
      }
    });
  </script>
</body>
</html>
