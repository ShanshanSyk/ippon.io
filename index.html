<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>IPPON風システム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{
    --bg:#0B0D12; --panel:#15181F; --panel-line:#262B36;
    --gold:#FFE900; --gold-dim:#8C8300; --text:#F5F1E8; --text-dim:#8A8F9C;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .wrap{ width:100%; max-width:400px; text-align:center; }

  .logo{
    font-family:'Oswald', sans-serif;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.5em;
    color:var(--gold);
    margin-bottom:44px;
  }

  .menu{ display:flex; flex-direction:column; gap:12px; }
  a.menu-btn{
    display:block;
    text-decoration:none;
    padding:20px 20px;
    border-radius:10px;
    font-family:'Oswald', sans-serif;
    font-size:17px;
    letter-spacing:0.04em;
    transition:transform .08s ease, background .15s ease;
  }
  a.menu-btn:active{ transform:scale(0.98); }

  .primary{
    background:var(--gold);
    color:#1A1204;
    font-weight:700;
  }
  .primary:hover{ background:#fff066; }

  .secondary{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--panel-line);
    font-weight:600;
  }
  .secondary:hover{ border-color:var(--gold-dim); color:var(--gold); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">I P P O N</div>

    <div class="menu">
      <a class="menu-btn primary" href="ippon-create.html">部屋を作る</a>
      <a class="menu-btn secondary" href="ippon-join.html">部屋に入る</a>
    </div>
  </div>
</body>
</html>
