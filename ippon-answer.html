<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>回答 - IPPON</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{
    --gold:#FFE900; --ink:#14140F; --ink-dim:#5A5A44; --bar:#0A0A0C;
    --white:#FFFFFF; --red:#C7302B; --green:#2E9E4F;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--ink); color:var(--white);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }

  .topbar{
    background:var(--bar);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
  }
  .logo{ font-family:'Oswald', sans-serif; font-weight:700; font-size:16px; letter-spacing:0.15em; color:var(--gold); }
  .room-info{ font-size:12px; color:#BDBDBD; }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .operator-wrap{ position:relative; }
  .operator-btn{
    background:transparent; border:1px solid rgba(255,255,255,0.25); color:var(--gold);
    font-size:12px; padding:5px 10px; border-radius:14px; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .operator-btn:hover{ border-color:var(--gold); }
  .operator-dropdown{
    display:none;
    position:absolute; right:0; top:calc(100% + 6px);
    background:#1C1C16; border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; overflow:hidden; z-index:60;
    min-width:140px;
  }
  .operator-dropdown.show{ display:block; }
  .operator-dropdown button{
    display:block; width:100%; text-align:left;
    background:transparent; border:none; color:#EDEDED;
    font-size:13px; padding:11px 14px; cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .operator-dropdown button:hover{ background:rgba(255,255,255,0.08); }
  .operator-dropdown button:first-child{ border-bottom:1px solid rgba(255,255,255,0.1); }

  .status-bar{
    text-align:center;
    padding:14px 0;
    font-family:'Oswald', sans-serif;
    font-size:14px;
    letter-spacing:0.08em;
    background:#1C1C16;
  }
  .status-bar .value{ color:var(--gold); font-weight:700; margin-left:8px; }

  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
    padding:20px;
    text-align:center;
  }

  .answer-btn{
    width:220px; height:220px;
    border-radius:50%;
    background:var(--gold);
    color:var(--ink);
    font-family:'Oswald', sans-serif;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.05em;
    border:none;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, opacity .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .answer-btn:active{ transform:scale(0.95); }
  .answer-btn:disabled{
    background:#3A3A32; color:#6E6E62;
    cursor:default; box-shadow:none;
  }

  .feedback{ font-size:14px; color:#BDBDBD; min-height:20px; }
  .feedback.mine{ color:var(--gold); font-weight:700; }
  .feedback.taken{ color:#BDBDBD; }

  .blocked{
    text-align:center; padding:40px 24px; color:#BDBDBD; font-size:14px; line-height:1.8;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">IPPON</div>
    <div class="room-info" id="roomInfo"></div>
    <div class="topbar-right">
      <div class="operator-wrap">
        <button class="operator-btn" id="meBtn"></button>
        <div class="operator-dropdown" id="meDropdown">
          <button id="renameBtn">名前を変更</button>
          <button id="logoutBtn">ログアウト</button>
        </div>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="blocked">読み込み中…</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const roomId = params.get('room');
    const content = document.getElementById('content');
    const roomInfo = document.getElementById('roomInfo');
    const meBtn = document.getElementById('meBtn');
    const meDropdown = document.getElementById('meDropdown');

    if(!roomId){
      content.innerHTML = '<div class="blocked">URLに ?room=部屋番号 がありません</div>';
    } else {
      const stored = localStorage.getItem('ippon-participant-' + roomId);
      if(!stored){
        content.innerHTML = '<div class="blocked">この部屋にまだ参加していません。<br><a href="ippon-join.html" style="color:#FFE900;">部屋に入る画面</a>からどうぞ。</div>';
      } else {
        let me = JSON.parse(stored);
        meBtn.textContent = me.name;

        const roomRef = db.collection('rooms').doc(roomId);
        const participantsRef = roomRef.collection('participants');
        const myParticipantRef = participantsRef.doc(me.id);

        roomRef.get().then((snap) => {
          if(snap.exists){ roomInfo.textContent = snap.data().name; }
        });

        meBtn.addEventListener('click', () => meDropdown.classList.toggle('show'));
        document.addEventListener('click', (e) => {
          if(!e.target.closest('.operator-wrap')){ meDropdown.classList.remove('show'); }
        });

        document.getElementById('renameBtn').addEventListener('click', async () => {
          const newName = prompt('新しい名前を入力してください', me.name);
          meDropdown.classList.remove('show');
          if(!newName || !newName.trim() || newName.trim() === me.name) return;
          const trimmed = newName.trim();

          if(nameByteLength(trimmed) > NAME_MAX_BYTES){
            alert('名前が長すぎます（全角10文字・半角20文字くらいまで）');
            return;
          }
          const dup = await participantsRef.where('name', '==', trimmed).get();
          const takenByOther = dup.docs.some((d) => d.id !== me.id);
          if(takenByOther){
            alert('その名前はすでに使われています');
            return;
          }

          await myParticipantRef.update({ name: trimmed });
          me = { id: me.id, name: trimmed };
          localStorage.setItem('ippon-participant-' + roomId, JSON.stringify(me));
          meBtn.textContent = trimmed;
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('ippon-participant-' + roomId);
          location.href = 'ippon-join.html';
        });

        let myRole = null;
        let roomStatus = '準備中';
        let currentAnswerer = null;
        let kicked = false;

        function render(){
          if(kicked){
            content.innerHTML = '<div class="blocked">この部屋から退出させられました。</div>';
            return;
          }
          if(myRole !== '回答者'){
            const roleLink = myRole === '採点者'
              ? '<br><a href="ippon-score.html?room=' + roomId + '" style="color:#FFE900;">採点画面はこちら</a>'
              : '';
            content.innerHTML = '<div class="blocked">あなたの役割は「回答者」ではありません（現在：' + (myRole || '不明') + '）。<br>主催者に確認してください。' + roleLink + '</div>';
            return;
          }

          const canAnswer = roomStatus === '回答受付中' && !currentAnswerer;
          const isMine = currentAnswerer && currentAnswerer.participantId === me.id;

          let feedback = '';
          if(isMine){
            feedback = '<div class="feedback mine">あなたが回答権を得ました！</div>';
          } else if(currentAnswerer){
            feedback = '<div class="feedback taken">' + escapeHtml(currentAnswerer.name) + 'さんが回答権を得ました</div>';
          } else if(roomStatus !== '回答受付中'){
            feedback = '<div class="feedback">今は回答を受け付けていません</div>';
          }

          content.innerHTML = `
            <div class="status-bar">ステータス<span class="value">${escapeHtml(roomStatus)}</span></div>
            <div class="stage">
              <button class="answer-btn" id="answerBtn" ${canAnswer ? '' : 'disabled'}>回答する</button>
              ${feedback}
            </div>
          `;

          const btn = document.getElementById('answerBtn');
          if(btn && canAnswer){
            btn.addEventListener('click', tryAnswer);
          }
        }

        async function tryAnswer(){
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(roomRef);
            const data = snap.data();
            if(data.status === '回答受付中' && !data.currentAnswerer){
              tx.update(roomRef, {
                currentAnswerer: { participantId: me.id, name: me.name },
                status: '採点中',
                scoringRound: firebase.firestore.FieldValue.increment(1)
              });
            }
          });
          roomRef.collection('logs').add({
            text: me.name + 'さんが回答権を取得しました（自動で採点中に切り替わりました）',
            operatorName: me.name,
            score: null,
            at: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        myParticipantRef.onSnapshot((snap) => {
          if(!snap.exists){ kicked = true; render(); return; }
          myRole = snap.data().role || '回答者';
          render();
        });

        roomRef.onSnapshot((snap) => {
          if(!snap.exists) return;
          const data = snap.data();
          roomStatus = data.status || '準備中';
          currentAnswerer = data.currentAnswerer || null;
          render();
        });
      }
    }

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
