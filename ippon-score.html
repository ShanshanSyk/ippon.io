<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>採点 - IPPON</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{
    --gold:#FFE900; --ink:#14140F; --ink-dim:#5A5A44; --bar:#0A0A0C;
    --white:#FFFFFF; --red:#C7302B;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--ink); color:var(--white);
    font-family:'Noto Sans JP', system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }

  .topbar{
    background:var(--bar);
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
  }
  .menu-btn{
    background:transparent; border:none; color:#fff; font-size:20px;
    cursor:pointer; padding:2px 6px;
  }
  .logo{ font-family:'Oswald', sans-serif; font-weight:700; font-size:16px; letter-spacing:0.15em; color:var(--gold); }
  .room-info{ font-size:12px; color:#BDBDBD; margin-left:auto; }
  .me-name-display{
    font-size:12px; color:var(--gold); border:1px solid rgba(255,233,0,0.3);
    padding:5px 10px; border-radius:14px; margin-left:12px;
  }

  .layout{ display:flex; height:calc(100vh - 49px); }
  .sidebar{
    width:180px; flex-shrink:0; background:var(--bar); padding:12px 0;
    transition:margin-left .18s ease;
  }
  .sidebar.collapsed{ margin-left:-180px; }
  .menu-item-full{
    display:block; padding:14px 22px; font-size:14px; font-weight:600;
    color:#fff; text-decoration:none; border-left:3px solid transparent;
    cursor:pointer;
  }
  .menu-item-full.active{ color:var(--gold); border-left-color:var(--gold); background:rgba(255,233,0,0.06); }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ---- 名前変更モーダル ---- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:200; align-items:center; justify-content:center;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{ background:#fff; border-radius:12px; padding:24px; width:90%; max-width:340px; }
  .modal-title{ font-family:'Oswald', sans-serif; font-weight:700; font-size:16px; margin:0 0 14px; color:var(--ink); }
  .modal-card input{
    width:100%; padding:10px 12px; border:1px solid #CCC; border-radius:6px;
    font-size:14px; margin-bottom:6px; font-family:inherit; box-sizing:border-box;
  }
  .modal-counter{ font-size:11px; color:#888; margin-bottom:18px; }
  .modal-counter.over{ color:var(--red); font-weight:600; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{ padding:9px 18px; border-radius:6px; font-size:13px; cursor:pointer; font-family:'Noto Sans JP', sans-serif; }
  .modal-cancel{ background:transparent; border:1px solid #CCC; color:#333; }
  .modal-save{ background:var(--ink); color:var(--gold); border:none; font-weight:600; }
  .modal-save:disabled{ opacity:0.4; cursor:default; }

  .status-bar{
    text-align:center;
    padding:14px 0;
    font-family:'Oswald', sans-serif;
    font-size:14px;
    letter-spacing:0.08em;
    background:#1C1C16;
  }
  .status-bar .value{ color:var(--gold); font-weight:700; margin-left:8px; }

  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    padding:20px;
    text-align:center;
  }

  .score-btn{
    width:220px; height:220px;
    border-radius:50%;
    background:var(--gold);
    color:var(--ink);
    font-family:'Oswald', sans-serif;
    font-size:36px;
    font-weight:700;
    letter-spacing:0.05em;
    border:none;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, opacity .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .score-btn:active{ transform:scale(0.95); }
  .score-btn:disabled{
    background:#3A3A32; color:#6E6E62;
    cursor:default; box-shadow:none;
  }

  .remaining{ font-size:13px; color:#BDBDBD; }
  .remaining b{ color:var(--gold); }

  .blocked{
    text-align:center; padding:40px 24px; color:#BDBDBD; font-size:14px; line-height:1.8;
  }
  .blocked a{ color:var(--gold); }
</style>
</head>
<body>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="メニュー">☰</button>
    <div class="logo">IPPON</div>
    <div class="room-info" id="roomInfo"></div>
    <div class="me-name-display" id="meNameDisplay"></div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <a class="menu-item-full" id="answerLink">回答</a>
      <a class="menu-item-full active" id="scoreLink">採点</a>
      <a class="menu-item-full" id="sidebarRenameBtn">名前を変更</a>
      <a class="menu-item-full" id="sidebarLogoutBtn">ログアウト</a>
    </div>

    <div class="main-col">
      <div id="content">
        <div class="blocked">読み込み中…</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="renameModalOverlay">
    <div class="modal-card">
      <div class="modal-title">名前を変更</div>
      <input type="text" id="renameModalInput">
      <div class="modal-counter" id="renameModalCounter"></div>
      <div class="modal-actions">
        <button class="modal-cancel" id="renameModalCancel">キャンセル</button>
        <button class="modal-save" id="renameModalSave">保存</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const roomId = params.get('room');
    const content = document.getElementById('content');
    const roomInfo = document.getElementById('roomInfo');
    const MAX_PRESSES = 2;

    document.getElementById('answerLink').href = 'ippon-answer.html?room=' + roomId;
    document.getElementById('scoreLink').href = 'ippon-score.html?room=' + roomId;
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });

    if(!roomId){
      content.innerHTML = '<div class="blocked">URLに ?room=部屋番号 がありません</div>';
    } else {
      const stored = localStorage.getItem('ippon-participant-' + roomId);
      if(!stored){
        content.innerHTML = '<div class="blocked">この部屋にまだ参加していません。<br><a href="ippon-join.html">部屋に入る画面</a>からどうぞ。</div>';
      } else {
        let me = JSON.parse(stored);
        const meNameDisplay = document.getElementById('meNameDisplay');
        meNameDisplay.textContent = me.name;

        const roomRef = db.collection('rooms').doc(roomId);
        const participantsRef = roomRef.collection('participants');
        const myParticipantRef = participantsRef.doc(me.id);

        roomRef.get().then((snap) => {
          if(snap.exists){ roomInfo.textContent = snap.data().name; }
        });

        // ---- 名前変更モーダル ----
        const renameModalOverlay = document.getElementById('renameModalOverlay');
        const renameModalInput = document.getElementById('renameModalInput');
        const renameModalCounter = document.getElementById('renameModalCounter');
        const renameModalSave = document.getElementById('renameModalSave');

        function updateRenameCounter(){
          const bytes = nameByteLength(renameModalInput.value.trim());
          renameModalCounter.textContent = bytes + ' / ' + NAME_MAX_BYTES + ' バイト';
          renameModalCounter.classList.toggle('over', bytes > NAME_MAX_BYTES);
          renameModalSave.disabled = bytes > NAME_MAX_BYTES || renameModalInput.value.trim() === '';
        }
        renameModalInput.addEventListener('input', updateRenameCounter);

        document.getElementById('sidebarRenameBtn').addEventListener('click', () => {
          renameModalInput.value = me.name;
          updateRenameCounter();
          renameModalOverlay.classList.add('show');
          renameModalInput.focus();
        });
        document.getElementById('renameModalCancel').addEventListener('click', () => {
          renameModalOverlay.classList.remove('show');
        });
        renameModalOverlay.addEventListener('click', (e) => {
          if(e.target === renameModalOverlay){ renameModalOverlay.classList.remove('show'); }
        });
        renameModalSave.addEventListener('click', async () => {
          const trimmed = renameModalInput.value.trim();
          if(!trimmed || nameByteLength(trimmed) > NAME_MAX_BYTES || trimmed === me.name) return;

          const dup = await participantsRef.where('name', '==', trimmed).get();
          const takenByOther = dup.docs.some((d) => d.id !== me.id);
          if(takenByOther){
            alert('その名前はすでに使われています');
            return;
          }

          await myParticipantRef.update({ name: trimmed });
          me = { id: me.id, name: trimmed };
          localStorage.setItem('ippon-participant-' + roomId, JSON.stringify(me));
          meNameDisplay.textContent = trimmed;
          renameModalOverlay.classList.remove('show');
        });

        document.getElementById('sidebarLogoutBtn').addEventListener('click', () => {
          localStorage.removeItem('ippon-participant-' + roomId);
          location.href = 'ippon-join.html';
        });

        let myRole = null;
        let kicked = false;
        let roomData = null;
        let myParticipantData = null;

        function myPressCount(){
          if(!myParticipantData || !roomData) return 0;
          if(myParticipantData.lastRoundScored !== roomData.scoringRound) return 0;
          return myParticipantData.pressCount || 0;
        }

        function render(){
          if(kicked){
            content.innerHTML = '<div class="blocked">この部屋から退出させられました。</div>';
            return;
          }
          if(myRole !== '採点者'){
            content.innerHTML = '<div class="blocked">あなたの役割は「採点者」ではありません（現在：' + (myRole || '不明') + '）。<br>主催者に確認してください。</div>';
            return;
          }
          if(!roomData) return;

          const pressCount = myPressCount();
          const remaining = MAX_PRESSES - pressCount;
          const scoringNow = roomData.status === '採点中';
          const roomFull = roomData.score >= roomData.maxScore;
          const canPress = scoringNow && remaining > 0 && !roomFull;

          content.innerHTML = `
            <div class="status-bar">ステータス<span class="value">${escapeHtml(roomData.status || '準備中')}</span></div>
            <div class="stage">
              <button class="score-btn" id="scoreBtn" ${canPress ? '' : 'disabled'}>＋1</button>
              <div class="remaining">あなたの持ち点：<b>${Math.max(0, remaining)}</b> / ${MAX_PRESSES}</div>
              ${!scoringNow ? '<div class="remaining">今は採点を受け付けていません</div>' : ''}
              ${roomFull ? '<div class="remaining">すでに満点です</div>' : ''}
            </div>
          `;

          const btn = document.getElementById('scoreBtn');
          if(btn && canPress){
            btn.addEventListener('click', pressScore);
          }
        }

        async function pressScore(){
          await db.runTransaction(async (tx) => {
            const roomSnap = await tx.get(roomRef);
            const pSnap = await tx.get(myParticipantRef);
            const room = roomSnap.data();
            const p = pSnap.data();

            if(room.status !== '採点中') return;
            if(room.score >= room.maxScore) return;

            const currentCount = (p.lastRoundScored === room.scoringRound) ? (p.pressCount || 0) : 0;
            if(currentCount >= MAX_PRESSES) return;

            tx.update(roomRef, { score: room.score + 1 });
            tx.update(myParticipantRef, {
              lastRoundScored: room.scoringRound,
              pressCount: currentCount + 1
            });
          });

          roomRef.collection('logs').add({
            text: me.name + 'さんが採点で＋1しました',
            operatorName: me.name,
            score: null,
            at: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        myParticipantRef.onSnapshot((snap) => {
          if(!snap.exists){ kicked = true; render(); return; }
          myParticipantData = snap.data();
          myRole = myParticipantData.role || '回答者';
          render();
        });

        roomRef.onSnapshot((snap) => {
          if(!snap.exists) return;
          roomData = snap.data();
          if(roomData.scoringRound === undefined) roomData.scoringRound = 0;
          render();
        });
      }
    }

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
